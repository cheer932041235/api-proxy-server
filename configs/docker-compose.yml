# Docker Compose 部署方案（替代 systemd，二选一）
# 用法: docker compose up -d

version: "3.8"

services:
  api-proxy:
    build: ..
    container_name: api-proxy
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ../logs:/app/logs
      - ../.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
